<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miss Loren: Queen of the Runway</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffe3ef;--card:#fff7fb;--pink:#ff4f9a;--soft:#ff9fc7;--text:#c2185b;--gold:#e0a800;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#3a1428;--card:#4d1b36;--pink:#ff7ab8;--soft:#ff9fc7;--text:#ffc2dd;--gold:#ffd24d}}
:root[data-theme="dark"]{--bg:#3a1428;--card:#4d1b36;--pink:#ff7ab8;--soft:#ff9fc7;--text:#ffc2dd;--gold:#ffd24d}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:'Pacifico','Brush Script MT',cursive;text-align:center;display:flex;flex-direction:column;align-items:center;padding:10px}
h1{margin:4px 0;font-size:clamp(24px,6.5vw,36px);color:var(--pink);text-shadow:2px 2px 0 var(--soft)}
#hud{font-size:19px;margin-bottom:6px}
#wrap{position:relative;width:min(94vw,360px);border:4px solid var(--soft);border-radius:24px;overflow:hidden;background:var(--card);touch-action:none}
canvas{display:block;width:100%;height:auto}
#ov{position:absolute;inset:0;background:color-mix(in srgb,var(--card) 93%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:8px}
#ov h2{margin:0;font-size:28px;color:var(--pink)}
#ov p{margin:0;font-size:16px;line-height:1.5}
#ov img{height:130px}
#sash{display:none;background:linear-gradient(90deg,var(--pink),var(--soft));color:#fff;padding:6px 18px;border-radius:8px;font-size:20px;transform:rotate(-3deg);border:2px solid var(--gold)}
button{font:inherit;font-size:20px;color:#fff;background:var(--pink);border:0;border-radius:999px;padding:10px 28px;box-shadow:0 4px 0 var(--soft);cursor:pointer}
button:active{transform:translateY(3px);box-shadow:none}
</style>
</head>

<div id="sash">MISS WHOLE WORLD 👑</div>
<h2 id="t">Okay Loren, your turn 💖</h2>
<p id="m">Slide to strut and grab all the fashion. Get 12 and you get your crown 👑 (no pressure, you’re already a queen)</p>
<button id="b">Walk!</button>
</div>
</div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),ov=document.getElementById('ov'),sc=document.getElementById('s');
const im=new Image();im.src=document.getElementById('im').src;
const T=['👗','👠','👜','💄','💎','👑','🕶️','✨','🧣','💍'];
const W=['SLAY!','Yass queen!','Werk!','Iconic!','Fierce!','Gorgeous!'];
const hw=y=>28+y/560*125;
let u=0,items=[],pops=[],fl=[],conf=[],score=0,run=false,win=false,tick=0,raf;
function move(e){const r=cv.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX);u=Math.max(-.9,Math.min(.9,((cx-r.left)*360/r.width-180)/hw(480)))}
cv.addEventListener('pointermove',move);cv.addEventListener('touchmove',move,{passive:true});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')u=Math.max(-.9,u-.15);if(e.key==='ArrowRight')u=Math.min(.9,u+.15)});
function start(){cancelAnimationFrame(raf);score=0;sc.textContent=0;items=[];pops=[];conf=[];win=false;run=true;ov.style.display='none';loop()}
document.getElementById('b').onclick=start;
function stage(){
 const g=x.createLinearGradient(0,0,0,560);g.addColorStop(0,'#3b1030');g.addColorStop(.35,'#ff9fc7');g.addColorStop(1,'#ffe3ef');x.fillStyle=g;x.fillRect(0,0,360,560);
 x.fillStyle='rgba(255,255,255,.12)';[[60,0],[300,0]].forEach(([a])=>{x.beginPath();x.moveTo(a,0);x.lineTo(a-70,560);x.lineTo(a+70,560);x.fill()});
 x.beginPath();x.moveTo(180-28,40);x.lineTo(180+28,40);x.lineTo(180+153,560);x.lineTo(180-153,560);x.closePath();
 const r=x.createLinearGradient(0,40,0,560);r.addColorStop(0,'#fff');r.addColorStop(1,'#ffd6e8');x.fillStyle=r;x.fill();
 x.strokeStyle='#e0a800';x.lineWidth=4;x.stroke();
 x.setLineDash([14,14]);x.lineDashOffset=-tick*2;x.strokeStyle='#ff9fc7';x.lineWidth=3;x.beginPath();x.moveTo(180,40);x.lineTo(180,560);x.stroke();x.setLineDash([]);
 x.font='22px serif';x.textAlign='center';for(let i=0;i<7;i++){x.fillText('🙌',16,110+i*60+(tick%40<20?i%2*4:(i+1)%2*4));x.fillText('👏',344,110+i*60+(tick%40<20?(i+1)%2*4:i%2*4))}
}
function loop(){
 tick++;stage();
 if(tick%45===0)fl.push({s:Math.random()<.5?-1:1,y:90+Math.random()*380,t:12});
 fl.forEach(f=>{f.t--;x.font='26px serif';x.fillText('📸',f.s<0?18:342,f.y);if(f.t>0){x.fillStyle='rgba(255,255,255,'+f.t/14+')';x.beginPath();x.arc(f.s<0?18:342,f.y-6,10+(12-f.t)*3,0,7);x.fill()}});
 fl=fl.filter(f=>f.t>-5);
 if(run){
  if(tick%38===0)items.push({u:Math.random()*1.8-.9,y:50,e:T[Math.random()*T.length|0]});
  const sp=1.5+score*.06;
  items.forEach(i=>{i.y+=sp+i.y/560*2.4;const s=.35+i.y/560*.9;x.font=Math.round(38*s)+'px serif';x.fillText(i.e,180+i.u*hw(i.y),i.y)});
  items=items.filter(i=>{if(i.y>430&&i.y<540&&Math.abs(i.u-u)<.28){score++;sc.textContent=score;pops.push({x:180+u*hw(480),y:410,t:40,w:W[Math.random()*W.length|0]});if(score>=12)finish();return false}return i.y<570});
 }
 const py=490,bob=Math.sin(tick*.2)*4,sw=Math.sin(tick*.2)*.05;
 x.save();x.translate(180+u*hw(py),py+bob);x.rotate(sw);x.drawImage(im,-38,-112,76,114);x.restore();
 pops.forEach(p=>{p.t--;p.y-=1;x.font='20px Pacifico,cursive';x.lineWidth=4;x.strokeStyle='#fff';x.strokeText(p.w,p.x,p.y);x.fillStyle='#ff4f9a';x.fillText(p.w,p.x,p.y)});
 pops=pops.filter(p=>p.t>0);
 conf.forEach(c=>{c.y+=c.v;c.x+=Math.sin(c.y/20);x.fillStyle=c.c;x.fillRect(c.x,c.y,7,10);if(c.y>570)c.y=-10});
 raf=requestAnimationFrame(loop);
}
function finish(){
 run=false;win=true;
 for(let i=0;i<110;i++)conf.push({x:Math.random()*360,y:Math.random()*-560,v:2+Math.random()*3,c:['#ff4f9a','#ff9fc7','#ffd700','#fff','#b388ff'][i%5]});
 setTimeout(()=>{
  document.getElementById('sash').style.display='block';
  document.getElementById('t').textContent='HAPPY BIRTHDAY LOREN!! 🎂';
  document.getElementById('m').innerHTML='Okay okay, you win. Miss Whole World, obviously. 👑<br>You’re honestly the best and I’m so lucky to have you. Go eat cake, wear the cute outfit, and enjoy every second today. Love you!! 💕';
  document.getElementById('b').textContent='Walk again';
  ov.style.display='flex';
 },2000);
}
im.onload=()=>{stage();x.drawImage(im,142,378,76,114)};
</script>
